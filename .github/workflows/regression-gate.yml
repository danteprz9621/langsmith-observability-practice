name: Prompt-regression gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run prompt-regression gate
        env:
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ vars.LANGCHAIN_PROJECT }}
          # Presence of GROQ_API_KEY is what switches agents/rag_agent.py
          # and experiments.py's judge off Ollama and onto Groq's hosted
          # inference -- this runner has no GPU and no local Ollama
          # install, so this is required, not optional, for CI.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Only the first 3 golden examples in CI, to stay well inside
          # Groq's free-tier rate limits and keep the job fast. Local runs
          # (EVAL_SAMPLE_SIZE unset) still cover the full dataset.
          EVAL_SAMPLE_SIZE: "3"
        run: pytest tests/test_regression_gate.py -v
