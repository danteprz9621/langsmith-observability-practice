version: 2.1

jobs:
  regression-gate:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout

      # ollama-models.txt just lists model names -- its checksum is the
      # cache key, so editing that file (adding/changing a model) is what
      # busts the cache. Model weights (~9GB for both) never need
      # re-downloading otherwise.
      - restore_cache:
          keys:
            - ollama-models-v1-{{ checksum ".circleci/ollama-models.txt" }}

      - run:
          name: Install Ollama
          command: curl -fsSL https://ollama.com/install.sh | sh

      - run:
          name: Start Ollama server
          command: ollama serve
          background: true

      - run:
          name: Wait for Ollama to be ready
          command: |
            for i in $(seq 1 30); do
              curl -sf http://localhost:11434/api/tags && exit 0
              sleep 2
            done
            echo "Ollama never came up" && exit 1

      - run:
          name: Pull agent + judge models
          # No GPU on this executor -- both 7-8B models run on CPU, so this
          # (and the test run below) are slow on a cold cache. That's why
          # caching ~/.ollama/models matters here more than in a typical
          # pip-install cache.
          no_output_timeout: 20m
          command: |
            while read -r model; do ollama pull "$model"; done < .circleci/ollama-models.txt

      - save_cache:
          key: ollama-models-v1-{{ checksum ".circleci/ollama-models.txt" }}
          paths:
            - ~/.ollama/models

      - run:
          name: Install Python deps
          command: |
            python3 -m venv .venv
            . .venv/bin/activate
            pip install -r requirements.txt

      - run:
          name: Run prompt-regression gate
          no_output_timeout: 20m
          command: |
            . .venv/bin/activate
            pytest tests/test_regression_gate.py -v

workflows:
  regression-gate-workflow:
    jobs:
      - regression-gate
